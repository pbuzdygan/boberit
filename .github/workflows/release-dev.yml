name: Build and publish development release

on:
  release:
    types: [published]

concurrency:
  group: release-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.release.target_commitish == 'dev' &&
      github.event.release.prerelease == true &&
      startsWith(github.event.release.tag_name, 'v') &&
      contains(github.event.release.tag_name, '-dev.')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev_latest
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
