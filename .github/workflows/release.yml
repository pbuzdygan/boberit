name: Build and publish release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.target_commitish }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      (github.event.release.target_commitish == 'dev' &&
       github.event.release.prerelease == true &&
       startsWith(github.event.release.tag_name, 'dev')) ||
      (github.event.release.target_commitish == 'main' &&
       github.event.release.prerelease == false &&
       !startsWith(github.event.release.tag_name, 'dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Prepare isolated image channel
        id: image
        shell: bash
        env:
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TARGET" == "dev" ]]; then
            echo "channel=dev_latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Re-run apt update/upgrade for every release instead of reusing old OS packages.
          no-cache-filters: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.channel }}
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ github.event.release.target_commitish }}
          cache-to: type=gha,mode=max,scope=${{ github.event.release.target_commitish }}
          provenance: mode=max
          sbom: true

      - name: Scan amd64 release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          version: v0.74.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
        env:
          TRIVY_PLATFORM: linux/amd64

      - name: Scan arm64 release image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
        run: >-
          trivy image
          --platform linux/arm64
          --scanners vuln
          --pkg-types os,library
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          "$IMAGE_REF"
